<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d9a8f7"/>
      <stop offset="50%" stop-color="#8b2fc9"/>
      <stop offset="100%" stop-color="#2d1b52"/>
    </radialGradient>
    <filter id="softGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" fill="#1c1d2b"/>

  <!-- almond / eye shape -->
  <path d="M 30 120 Q 120 40 210 120 Q 120 200 30 120 Z" fill="url(#glow2)" filter="url(#softGlow2)"/>

  <circle cx="120" cy="120" r="22" fill="#1c1d2b"/>
</svg>
